<!DOCTYPE html>
<!-- #created 11/08/2026 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI装箱优化系统 - 运筹学+深度学习</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --surface-0: #05070c;
        --surface-1: #0a0d12;
        --surface-2: #0f131c;
        --surface-3: #161d2b;
        --surface-4: #1e2636;
        --accent: #38bdf8;
        --accent-muted: #6ee7b7;
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --success: #10b981;
        --warning: #f59e0b;
        --error: #ef4444;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, var(--surface-0) 0%, var(--surface-2) 100%);
        color: var(--text);
        min-height: 100vh;
        padding: clamp(1rem, 3vw, 2rem);
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 3rem;
      }

      h1 {
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-muted) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        color: var(--text-dim);
        font-size: clamp(0.875rem, 2vw, 1rem);
      }

      .status-bar {
        background: var(--surface-2);
        padding: 1rem;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      .status-indicator.online {
        background: var(--success);
      }

      .status-indicator.offline {
        background: var(--error);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      button {
        background: var(--surface-3);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1rem 1.5rem;
        border-radius: 999px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 500;
      }

      button:hover {
        background: var(--surface-4);
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      button.primary {
        background: var(--accent);
        color: var(--surface-0);
      }

      button.primary:hover {
        background: var(--accent-muted);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* 进度条样式 */
      .progress-section {
        background: var(--surface-2);
        padding: 1.5rem;
        border-radius: 1rem;
        margin-bottom: 2rem;
        display: none;
      }

      .progress-section.active {
        display: block;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 1rem;
      }

      .progress-label {
        font-weight: 600;
        color: var(--accent);
      }

      .progress-percentage {
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
      }

      .progress-bar-container {
        background: var(--surface-0);
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 0.5rem;
      }

      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--accent) 0%, var(--accent-muted) 100%);
        transition: width 0.3s ease;
        border-radius: 999px;
      }

      .progress-message {
        font-size: 0.875rem;
        color: var(--text-dim);
        font-style: italic;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .stat-card {
        background: var(--surface-2);
        padding: 1.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .stat-label {
        font-size: 0.875rem;
        color: var(--text-dim);
        margin-bottom: 0.5rem;
      }

      .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      .solutions {
        display: grid;
        gap: 1.5rem;
      }

      .solution-card {
        background: var(--surface-2);
        padding: 1.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.2s;
      }

      .solution-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .solution-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .solution-title {
        font-size: 1.25rem;
        font-weight: 600;
      }

      .solution-badge {
        background: var(--accent);
        color: var(--surface-0);
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .solution-metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1rem;
      }

      .metric {
        display: flex;
        flex-direction: column;
      }

      .metric-label {
        font-size: 0.75rem;
        color: var(--text-dim);
        margin-bottom: 0.25rem;
      }

      .metric-value {
        font-size: 1.125rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .learning-section {
        background: var(--surface-2);
        padding: 1.5rem;
        border-radius: 1rem;
        margin-top: 2rem;
        border: 2px dashed var(--accent-muted);
      }

      .learning-title {
        font-size: 1.125rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: var(--accent-muted);
      }

      pre {
        background: var(--surface-0);
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        font-size: 0.875rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🎯 AI装箱优化系统</h1>
        <p class="subtitle">运筹学算法 × 沙盘自进化 × 3D可视化</p>
      </header>

      <div class="status-bar">
        <div class="status-indicator online" id="status"></div>
        <span id="status-text">🟢 服务运行中</span>
      </div>

      <div class="controls">
        <button onclick="loadDemo()">📦 加载示例数据</button>
        <button onclick="runOptimization()" class="primary" id="optimizeBtn" disabled>
          🎯 运行优化
        </button>
        <button onclick="viewLearningStats()">📊 查看学习报告</button>
        <button onclick="reset()">🔄 重置</button>
      </div>

      <!-- 进度条区域 -->
      <div class="progress-section" id="progressSection">
        <div class="progress-header">
          <span class="progress-label" id="progressLabel">计算中...</span>
          <span class="progress-percentage" id="progressPercentage">0%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
        <div class="progress-message" id="progressMessage">准备开始...</div>
      </div>

      <div class="stats-grid" id="statsGrid" style="display: none">
        <div class="stat-card">
          <div class="stat-label">货物总数</div>
          <div class="stat-value" id="totalItems">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">总体积 (m³)</div>
          <div class="stat-value" id="totalVolume">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">总重量 (kg)</div>
          <div class="stat-value" id="totalWeight">0</div>
        </div>
      </div>

      <div class="solutions" id="solutions"></div>

      <!-- 沙盘学习区域 -->
      <div class="learning-section" id="learningSection" style="display: none">
        <div class="learning-title">🧠 沙盘自进化系统</div>
        <pre id="learningReport"></pre>
      </div>
    </div>

    <script>
      let currentItems = []
      let eventSource = null
      const sessionId = 'session-' + Date.now()

      // 加载示例数据
      async function loadDemo() {
        try {
          const res = await fetch('/api/load-demo')
          const data = await res.json()

          if (data.success) {
            currentItems = data.items
            document.getElementById('totalItems').textContent = data.items.length
            document.getElementById('optimizeBtn').disabled = false
            document.getElementById('statsGrid').style.display = 'grid'

            // 计算总体积和重量
            const totalVolume = data.items.reduce((sum, item) => {
              return sum + (item.length * item.width * item.height) / 1000000
            }, 0)
            const totalWeight = data.items.reduce((sum, item) => sum + item.weight, 0)

            document.getElementById('totalVolume').textContent = totalVolume.toFixed(2)
            document.getElementById('totalWeight').textContent = totalWeight.toFixed(0)

            alert(`✅ 已加载 ${data.items.length} 个货物单元`)
          }
        } catch (error) {
          alert('❌ 加载失败: ' + error.message)
        }
      }

      // 运行优化
      async function runOptimization() {
        if (currentItems.length === 0) {
          alert('请先加载数据')
          return
        }

        // 显示进度条
        const progressSection = document.getElementById('progressSection')
        progressSection.classList.add('active')

        // 重置进度
        updateProgress('准备计算', 0, '初始化算法引擎...')

        // 建立SSE连接
        eventSource = new EventSource(`/api/optimize/progress/${sessionId}`)

        eventSource.onmessage = (event) => {
          const data = JSON.parse(event.data)

          if (data.type === 'progress') {
            updateProgress(data.algorithm, data.progress, data.message)
          } else if (data.type === 'complete') {
            eventSource.close()
          }
        }

        eventSource.onerror = () => {
          eventSource.close()
        }

        // 发送优化请求
        try {
          const res = await fetch('/api/optimize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              items: currentItems,
              sessionId
            })
          })

          const data = await res.json()

          if (data.success) {
            displaySolutions(data.solutions)
            progressSection.classList.remove('active')
          }
        } catch (error) {
          alert('❌ 优化失败: ' + error.message)
          progressSection.classList.remove('active')
        }
      }

      // 更新进度
      function updateProgress(algorithm, percentage, message) {
        document.getElementById('progressLabel').textContent = algorithm
        document.getElementById('progressPercentage').textContent = Math.round(percentage) + '%'
        document.getElementById('progressBar').style.width = percentage + '%'
        document.getElementById('progressMessage').textContent = message
      }

      // 显示方案
      function displaySolutions(solutions) {
        const container = document.getElementById('solutions')
        container.innerHTML = ''

        solutions.forEach((solution, index) => {
          const card = document.createElement('div')
          card.className = 'solution-card'
          card.innerHTML = `
            <div class="solution-header">
              <div class="solution-title">${solution.algorithm}</div>
              ${index === 0 ? '<div class="solution-badge">🏆 最优方案</div>' : ''}
            </div>
            <div class="solution-metrics">
              <div class="metric">
                <div class="metric-label">集装箱数量</div>
                <div class="metric-value">${solution.stats.containerCount}</div>
              </div>
              <div class="metric">
                <div class="metric-label">体积利用率</div>
                <div class="metric-value">${solution.stats.volumeUtilization.toFixed(1)}%</div>
              </div>
              <div class="metric">
                <div class="metric-label">重量利用率</div>
                <div class="metric-value">${solution.stats.weightUtilization.toFixed(1)}%</div>
              </div>
              <div class="metric">
                <div class="metric-label">已放置</div>
                <div class="metric-value">${solution.stats.placedItems}</div>
              </div>
              <div class="metric">
                <div class="metric-label">未放置</div>
                <div class="metric-value">${solution.stats.unplacedItems}</div>
              </div>
              <div class="metric">
                <div class="metric-label">执行时间</div>
                <div class="metric-value">${(solution.stats.executionTime / 1000).toFixed(2)}s</div>
              </div>
            </div>
          `
          container.appendChild(card)
        })
      }

      // 查看学习报告
      function viewLearningStats() {
        const section = document.getElementById('learningSection')
        section.style.display = section.style.display === 'none' ? 'block' : 'none'

        if (section.style.display === 'block') {
          document.getElementById('learningReport').textContent =
            '=== 沙盘学习系统报告 ===\n\n决策总数: 待加载\n成功率: 待计算\n\n当前权重:\n- 体积优先: 0.500\n- 靠角放置: 0.300\n- 分层构建: 0.400\n- 重量平衡: 0.600\n- 旋转偏好: 0.200'
        }
      }

      // 重置
      function reset() {
        currentItems = []
        document.getElementById('optimizeBtn').disabled = true
        document.getElementById('statsGrid').style.display = 'none'
        document.getElementById('solutions').innerHTML = ''
        document.getElementById('progressSection').classList.remove('active')
        document.getElementById('learningSection').style.display = 'none'

        if (eventSource) {
          eventSource.close()
        }
      }

      // 检查服务状态
      async function checkHealth() {
        try {
          const res = await fetch('/api/health')
          const data = await res.json()
          if (data.success) {
            document.getElementById('status').className = 'status-indicator online'
            document.getElementById('status-text').textContent = '🟢 服务运行中'
          }
        } catch {
          document.getElementById('status').className = 'status-indicator offline'
          document.getElementById('status-text').textContent = '🔴 服务离线'
        }
      }

      // 页面加载时检查
      checkHealth()
    </script>
  </body>
</html>
